[project]
name = "solder-studio"
version = "0.1.0"
description = "Local metallurgy literature dashboard"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.67.0",
    "openai==3.57.0",
    "pydantic==2.14.4",
    "pdfplumber==0.11.10",
    "pandas==3.1.1",
    "plotly==7.1.0",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]